# jump-xiaoe-live-demo（Python / FastAPI）公网入口：TLS 终结在 nginx，uvicorn 只监听 127.0.0.1:8090。
# 安装位置：/etc/nginx/sites-available/xiaoe-demo.david-tech.cn
#          软链到 /etc/nginx/sites-enabled/xiaoe-demo.david-tech.cn
# 首次签发证书前，先把本文件的 443 段整段注释掉（或直接用 .bak-http 版本），只留 80 的 ACME，
# 否则 nginx -t 会因为证书文件还不存在而失败。
#
# 后端只提供 API，不托管任何静态产物：除 /health 与 /api/ 之外一律 404，
# 避免以后新增对外接口时被意外暴露。

server {
    listen 80;
    listen [::]:80;
    server_name xiaoe-demo.david-tech.cn;

    # certbot HTTP-01 校验目录（证书续期也走这里）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name xiaoe-demo.david-tech.cn;

    ssl_certificate     /etc/letsencrypt/live/xiaoe-demo.david-tech.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaoe-demo.david-tech.cn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # 只有 JSON 请求体，无文件上传
    client_max_body_size 1m;

    # 健康检查（回显 env / 配置来源 / 凭证是否配齐，只给布尔）
    location = /health {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/snippets/xiaoe-sdk-proxy.conf;
    }

    # 业务接口：/api/login、/api/session/check、/api/profile、/api/check-bind-phone、
    # /api/bind-or-merge-phone、/api/login-url，以及 FastAPI 自带文档 /api/docs
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/snippets/xiaoe-sdk-proxy.conf;
    }

    # 未登记路径一律拒绝（后端自己的 JSON 信封 404 只对直连 8090 生效）
    location / {
        return 404;
    }
}
