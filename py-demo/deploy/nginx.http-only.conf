# 首次签发证书前用的最小站点：只开 80，留 ACME 校验目录。
# 证书不存在时 provision.sh 装这一份，装完跑 certbot，再重跑 provision.sh 换成带 443 的完整版。

server {
    listen 80;
    listen [::]:80;
    server_name xiaoe-demo.david-tech.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 证书还没签好：业务接口暂时无法对外（小程序要求 https），
    # 这里明确返回 503 而不是把裸 HTTP 暴露出去。
    location / {
        default_type application/json;
        return 503 '{"code":-1,"msg":"HTTPS 证书尚未就绪","data":null}';
    }
}
